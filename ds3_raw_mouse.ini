[Patch]
; Both patches are enabled automatically when the ASI plugin loads.
RawInput=true
RemoveCameraSmoothing=true
; Enables the keys in [Hotkeys] (they act only while the game window has focus).
Hotkeys=true
; Writes activity counters to DS3RawMouse.log every five seconds.
Diagnostics=true

[Mouse]
; Overall scale applied to every sensitivity. Valid range: 0.10 to 5.00.
; SensitivityDown/Up (F9/F10) adjust this value by 0.05 at runtime;
; ReloadConfig (F6) restores the value saved here.
SensitivityMultiplier=1.0
; Base radians-per-count scales.
; The aim profile is active while the right mouse button is held. Other special
; camera modes use the third-person profile unless the right mouse button is held.
ThirdPersonSensitivityX=0.000700
ThirdPersonSensitivityY=0.001850
AimSensitivityX=0.001100
AimSensitivityY=0.001100

[Hotkeys]
; F1-F24, Insert, Delete, Home, End, PageUp, PageDown, Pause, ScrollLock or Numpad0-9,
; optionally with Ctrl+, Shift+ and/or Alt+ (for example Ctrl+F7); None disables a key.
; A key fires only with exactly the modifiers given: F7 does not fire on Shift+F7.
; With DS3 Debug Menu loaded, keys on F1, F7 and F8 belong to the menu and are ignored
; here; bind the toggles to other keys (for example F11/F12) to keep them.
ReloadConfig=F6
ToggleCameraSmoothing=F7
ToggleRawInput=F8
SensitivityDown=F9
SensitivityUp=F10
