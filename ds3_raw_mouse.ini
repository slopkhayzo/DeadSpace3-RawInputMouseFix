[Patch]
; Both patches are enabled automatically when the ASI plugin loads.
RawInput=true
RemoveCameraSmoothing=true
; F6 reloads this file. F7/F8 toggle the patches. F9/F10 adjust SensitivityMultiplier.
Hotkeys=true
; Writes activity counters to DS3RawMouse.log every five seconds.
Diagnostics=true

[Mouse]
; Overall scale applied to every sensitivity. Valid range: 0.10 to 5.00.
; F9/F10 adjust this value by 0.05 at runtime; F6 restores the value saved here.
SensitivityMultiplier=1.0
; Base radians-per-count scales.
; The aim profile is active while the right mouse button is held. Other special
; camera modes use the third-person profile unless the right mouse button is held.
ThirdPersonSensitivityX=0.000700
ThirdPersonSensitivityY=0.001850
AimSensitivityX=0.001100
AimSensitivityY=0.001100
